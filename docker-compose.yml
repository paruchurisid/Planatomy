services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: planatomy
      POSTGRES_USER: planatomy
      POSTGRES_PASSWORD: planatomy
    ports:
      - "5432:5432"
    volumes:
      - planatomy_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planatomy -d planatomy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  planatomy_postgres_data:
